<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
    <meta name="theme-color" content="#12151a" />
    <meta name="referrer" content="no-referrer" />
    <!--
      Strict CSP: 'self' plus exactly the barcode lookup hosts. An accidental
      third-party request fails loudly in development rather than silently in
      production. No CDN fonts, scripts, or styles.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://world.openfoodfacts.org https://images.openfoodfacts.org; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    />
    <title>Macro Tracker</title>
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
