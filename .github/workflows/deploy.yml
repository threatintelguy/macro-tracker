# typecheck -> test -> build food index -> Vite build -> deploy to Pages.
#
# The bundled food index is generated in CI rather than committed, which
# keeps the repo small and the derivation reproducible: full Foundation and
# SR Legacy, plus a curated slice of USDA Branded. The step is optional:
# when no FoodData Central export is available the app ships on the curated
# table, which is the intended fallback rather than a failure.

name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The bundled index. Set FDC_URL to a zip of the FoodData Central
      # Foundation and SR Legacy JSON exports, and optionally FDC_BRANDED_URL
      # to the Branded Foods JSON export zip for the branded slice (it is
      # several gigabytes, and is streamed rather than parsed whole). Without
      # FDC_URL the step is skipped and the app uses the curated table alone.
      - name: Build USDA food index
        env:
          FDC_URL: ${{ secrets.FDC_URL }}
          FDC_BRANDED_URL: ${{ secrets.FDC_BRANDED_URL }}
        if: ${{ env.FDC_URL != '' }}
        run: |
          mkdir -p .fdc/generic .fdc/branded
          curl -sSL "$FDC_URL" -o .fdc/generic.zip
          unzip -q .fdc/generic.zip -d .fdc/generic
          BRANDED_ARGS=""
          if [ -n "$FDC_BRANDED_URL" ]; then
            curl -sSL "$FDC_BRANDED_URL" -o .fdc/branded.zip
            unzip -q .fdc/branded.zip -d .fdc/branded
            rm .fdc/branded.zip
            BRANDED_ARGS="--branded .fdc/branded"
          fi
          NODE_OPTIONS=--max-old-space-size=6144 npm run build:food-index -- --input .fdc/generic $BRANDED_ARGS --out public/usda-subset.bin

      - name: Build
        env:
          # GitHub Pages serves a project site from /<repo>/.
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
